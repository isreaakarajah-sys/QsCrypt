[package]
name = "qscrypt-crypto"
description = "Production crypto backend for the QsCrypt engine (RustCrypto)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
qscrypt-core = { path = "../qscrypt-core" }
aes = "0.8"
serpent = "0.5"
twofish = "0.7"
sha2 = "0.10"
hmac = "0.12"
whirlpool = "0.10"
ripemd = "0.1"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = "0.10"
getrandom = "0.2"

[dev-dependencies]
qscrypt-core = { path = "../qscrypt-core", features = ["reference"] }
