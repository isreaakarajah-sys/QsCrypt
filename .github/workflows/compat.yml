name: Compatibility

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    name: File systems, BitLocker and VeraCrypt against Linux tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: compat
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq exfatprogs dosfstools ntfs-3g cryptsetup > /dev/null
      - name: Build probes
        working-directory: core
        run: |
          cargo build --release -p qscrypt-core --features reference --example fsprobe
          cargo build --release -p qscrypt-crypto --example bdeprobe --example volprobe
      - name: File systems (FAT, exFAT, NTFS)
        run: core/testdata/fs_compat.sh
      - name: BitLocker and VeraCrypt (cryptsetup)
        if: always()
        run: core/testdata/crypt_compat.sh
