name: Research
on:
  push:
    branches: [research]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: BitLocker test images
        run: |
          curl -fsSL https://gitlab.com/cryptsetup/cryptsetup/-/raw/main/tests/bitlk-images.tar.xz -o b.tar.xz || { echo FAILED; exit 0; }
          ls -la b.tar.xz; tar xJf b.tar.xz; ls -laR bitlk-images | head -60
          cat bitlk-images/images.conf
      - name: Dump metadata of a few images
        run: |
          cd bitlk-images
          python3 - <<'PY'
          import struct, glob, os
          for f in sorted(glob.glob('bitlk-*.img')):
              d = open(f,'rb').read()
              print("=====", f, len(d))
              sig = d[3:11]
              togo = sig == b'MSWIN4.1'
              base = 424 if togo else 160
              offs = struct.unpack_from('<3Q', d, base+16)
              print("sig", sig, "boot", d[:3].hex(), "bps", struct.unpack_from('<H', d, 11)[0], "spc", d[13], "offs", offs)
              mo = offs[0]
              blk = d[mo:mo+64]
              fve_size = struct.unpack_from('<H', blk, 8)[0]
              print("block hdr", blk.hex())
              real = fve_size << 4
              print("fve_size", fve_size, "real", real)
              md = d[mo+64:mo+112]
              msize = struct.unpack_from('<I', md, 0)[0]
              print("meta hdr", md.hex(), "msize", msize)
              ents = d[mo+112:mo+64+msize]
              p = 0
              while p + 8 <= len(ents):
                  sz, et, vt, ver = struct.unpack_from('<4H', ents, p)
                  if sz == 0: break
                  print("  entry size=%d type=0x%x value=0x%x ver=%d" % (sz, et, vt, ver))
                  print("   ", ents[p:p+sz].hex())
                  p += sz
              val = d[mo+real:mo+real+96]
              print("validation", val.hex())
              # first bytes of header backup area location
              print("after", d[mo+real+96:mo+real+160].hex())
              if f.endswith('xts-128.img') or 'togo' in f:
                  print("sector0", d[:512].hex())
          PY
