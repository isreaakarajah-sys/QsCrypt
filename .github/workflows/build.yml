name: Build

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Engine tests (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: cargo test
        working-directory: core
        run: cargo test --workspace --release

      - name: VeraCrypt compatibility report
        if: always()
        working-directory: core
        run: |
          cargo test --release -p qscrypt-crypto --test kat veracrypt_sector_selftest -- --nocapture 2>&1 | grep -A40 "cascade self-test" || true
          cargo test --release -p qscrypt-ffi self_test_passes -- --nocapture 2>&1 | grep "self-test:" || true

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Kotlin errors surface here in ~2 minutes, before the slow engine build.
      - name: Compile app (Kotlin)
        working-directory: android
        run: ./gradlew :app:compileReleaseKotlin --no-daemon --stacktrace

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build engine for Android
        working-directory: core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk --platform 24 -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            -o ../android/app/src/main/jniLibs \
            build --release -p qscrypt-ffi
          find ../android/app/src/main/jniLibs -name '*.so' -exec ls -la {} \;

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.QS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/qscrypt-release.jks"
            echo "QS_KEYSTORE_PATH=$RUNNER_TEMP/qscrypt-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the QsCrypt release key."
          else
            echo "::warning::QS_KEYSTORE_BASE64 is not set. This APK is signed with a temporary debug key and cannot be installed over builds signed with the release key."
          fi

      - name: Build APK
        working-directory: android
        env:
          QS_KEYSTORE_PASSWORD: ${{ secrets.QS_KEYSTORE_PASSWORD }}
          QS_KEY_ALIAS: ${{ secrets.QS_KEY_ALIAS }}
          QS_KEY_PASSWORD: ${{ secrets.QS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          out=android/app/build/outputs/apk/release
          ls -la "$out"
          v="1.0.${GITHUB_RUN_NUMBER}"
          cp "$out/app-arm64-v8a-release.apk" "dist/QsCrypt-$v-modern-arm64.apk"
          cp "$out/app-armeabi-v7a-release.apk" "dist/QsCrypt-$v-old-phones-armv7.apk"
          cp "$out/app-universal-release.apk" "dist/QsCrypt-$v-universal.apk"
          cd dist && sha256sum *.apk | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: QsCrypt-apk
          path: dist/*

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [core, apk]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QsCrypt-apk
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: QsCrypt 1.0.${{ github.run_number }} · الإصدار الأول
          prerelease: false
          files: dist/*
          body: |
            الإصدار الأول، مبني تلقائياً من `main` (commit ${{ github.sha }}).

            - `modern-arm64`: للهواتف الحديثة (64-بت، أندرويد 7 فأحدث). الأصغر والأسرع.
            - `old-phones-armv7`: للهواتف القديمة (32-بت، أندرويد 7 فأحدث).
            - `universal`: يعمل على كل الهواتف، إن لم تعرف أيّهما تختار.

            بصمات الملفات (SHA-256) في `SHA256SUMS.txt`.
